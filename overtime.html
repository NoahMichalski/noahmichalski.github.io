<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Overtime Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { background:#111; color:#eee; font-family:Arial; margin:0; }
.header { background:#1a1d24; padding:10px; }
.controls { text-align:center; padding:10px; }

button, select, input {
    padding:6px 10px;
    margin:5px;
}

table { width:100%; border-collapse:collapse; }

th, td {
    border:1px solid #333;
    padding:6px;
    text-align:center;
}

th { background:#d9d9d9; color:#000; }

.normal { background:#2e7d32; }
.warning { background:#ffd966; color:#000; }
.overtime { background:#ff1a1a; color:#fff; }
.predicted { background:#ff4da6; }

td[contenteditable="true"] { outline:none; }

.popup {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#1a1d24;
    padding:20px;
    border:1px solid #444;
}
</style>
</head>

<body>

<div class="header">Overtime Dashboard</div>

<div class="controls">
<input type="file" id="fileInput" multiple>

<select id="weekSelect" onchange="render()">
<option value="0">Week 1</option>
<option value="1">Week 2</option>
</select>

<select id="daySelect" onchange="render()">
<option value="0">Mon</option>
<option value="1">Tue</option>
<option value="2">Wed</option>
<option value="3">Thu</option>
<option value="4">Fri</option>
</select>

<button onclick="loadExcel()">Load Excel</button>
<button onclick="showAddPopup()">Add Person</button>
<button onclick="emailPreview()">Email Preview</button>
</div>

<table id="table">
<thead>
<tr>
<th>Name</th>
<th>Mon</th>
<th>Tue</th>
<th>Wed</th>
<th>Thu</th>
<th>Fri</th>
<th>Actual</th>
<th>Projected</th>
<th>OT</th>
<th>Hit</th>
<th>Remove</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="popup" id="popup">
<h3>Add Person</h3>

<input id="newName" placeholder="Last, First"><br>

<select id="newWeek">
<option value="0">Week 1</option>
<option value="1">Week 2</option>
</select><br>

<input id="m" placeholder="Mon">
<input id="t" placeholder="Tue">
<input id="w" placeholder="Wed">
<input id="th" placeholder="Thu">
<input id="f" placeholder="Fri"><br>

<button onclick="addPerson()">Add</button>
<button onclick="closePopup()">Cancel</button>
</div>

<script>

let week1 = [];
let week2 = [];
let futureSelections = {};

function clean(v){
    let n = parseFloat(v);
    return isNaN(n) ? 0 : n;
}

async function loadExcel(){

    let files = fileInput.files;

    for(let f = 0; f < files.length; f++){

        let data = await files[f].arrayBuffer();
        let wb = XLSX.read(data);
        let sheet = wb.Sheets[wb.SheetNames[0]];
        let rows = XLSX.utils.sheet_to_json(sheet,{header:1});

        rows.forEach(r=>{

            let name = r[1];
            if(typeof name !== "string" || !name.includes(",")) return;

            name = name.trim().toLowerCase();

            let days = [
                clean(r[4]),
                clean(r[6]),
                clean(r[7]),
                clean(r[9]),
                clean(r[11])
            ];

            let exists =
                week1.some(p => p.name === name) ||
                week2.some(p => p.name === name);

            if(exists) return;

            if(weekSelect.value == "0"){
                week1.push({ name, days });
            } else {
                week2.push({ name, days });
            }

        });
    }

    render();
}

function getData(){
    return weekSelect.value == "0" ? week1 : week2;
}

function render(){

    let day = parseInt(daySelect.value);
    let data = getData();

    let tbody = table.querySelector("tbody");
    tbody.innerHTML="";

    let rows = data.map((r,index)=>{

        let projected=0,running=0,hit="-";

        for(let i=0;i<5;i++){

            let val;

            if(i <= day){
                val = r.days[i];
            } else {
                let key = `${weekSelect.value}-${index}-${i}`;
                let sel = futureSelections[key];

                if(sel === "OFF") val = 0;
                else if(sel) val = parseFloat(sel);
                else val = 8;
            }

            projected+=val;
            running+=val;

            if(running>40 && hit==="-" ){
                hit=["Mon","Tue","Wed","Thu","Fri"][i];
            }
        }

        let actual=r.days.reduce((a,b)=>a+b,0);
        let ot=projected>40?projected-40:0;

        return {...r,projected,actual,ot,hit,index};
    });

    rows.sort((a,b)=>b.projected-a.projected);

    rows.forEach(r=>{

        let tr=document.createElement("tr");

        if(r.projected>40) tr.className="overtime";
        else if(r.projected>=38) tr.className="warning";
        else tr.className="normal";

        let cells = "";

        for(let i=0;i<5;i++){

            if(i <= day){
                cells += `<td contenteditable="true"
                onblur="updateCell(${r.index}, ${i}, this.innerText)">
                ${r.days[i]}</td>`;
            } else {

                let key = `${weekSelect.value}-${r.index}-${i}`;
                let val = futureSelections[key] || "8";

                cells += `
                <td class="predicted">
                <select onchange="updateFuture('${key}', this.value)">
                <option value="8" ${val=="8"?"selected":""}>8</option>
                <option value="4" ${val=="4"?"selected":""}>4</option>
                <option value="0" ${val=="0"?"selected":""}>0</option>
                <option value="OFF" ${val=="OFF"?"selected":""}>OFF</option>
                </select>
                </td>`;
            }
        }

        tr.innerHTML=`
        <td>${r.name}</td>
        ${cells}
        <td>${r.actual.toFixed(1)}</td>
        <td>${r.projected.toFixed(1)}</td>
        <td>${r.ot.toFixed(1)}</td>
        <td>${r.hit}</td>
        <td><button onclick="removePerson(${r.index})">X</button></td>
        `;

        tbody.appendChild(tr);
    });
}

function removePerson(index){
    getData().splice(index,1);
    render();
}

function showAddPopup(){ popup.style.display="block"; }
function closePopup(){ popup.style.display="none"; }

function addPerson(){

    let name = newName.value.trim().toLowerCase();

    if(!name.includes(",")){
        alert("Use Last, First");
        return;
    }

    let days = [
        clean(m.value),
        clean(t.value),
        clean(w.value),
        clean(th.value),
        clean(f.value)
    ];

    if(newWeek.value == "0"){
        week1.push({ name, days });
    } else {
        week2.push({ name, days });
    }

    closePopup();
    render();
}

function updateCell(i,d,v){
    let num = parseFloat(v);
    if(isNaN(num)) num = 0;
    getData()[i].days[d] = num;
    render();
}

function updateFuture(k,v){
    futureSelections[k] = v;
    render();
}

/* 🔥 FINAL EXPORT */
function emailPreview(){

    let rows = document.querySelectorAll("#table tr");

    let totalOT = 0;
    let totalHours = 0;

    document.querySelectorAll("#table tbody tr").forEach(tr=>{
        let tds = tr.querySelectorAll("td");

        let actual = parseFloat(tds[6]?.innerText);
        let ot = parseFloat(tds[8]?.innerText);

        if(!isNaN(actual)) totalHours += actual;
        if(!isNaN(ot)) totalOT += ot;
    });

    let html = `
    <html><body style="font-family:Arial;">
    <h3>Overtime Report</h3>

    <div style="margin-bottom:10px;font-weight:bold;">
        Total Hours: ${totalHours.toFixed(1)}<br>
        Expected OT: ${totalOT.toFixed(1)}
    </div>

    <table style="border-collapse:collapse;">
    `;

    rows.forEach((tr,i)=>{

        html += "<tr>";

        let cells = tr.querySelectorAll("th,td");

        cells.forEach((td,idx)=>{

            // 🔥 skip remove column
            if(idx === cells.length - 1) return;

            let text = td.querySelector("select")
                ? td.querySelector("select").value
                : td.innerText;

            let style="border:1px solid #000;padding:6px;text-align:center;";

            if(i===0){
                style+="background:#d9d9d9;color:#000;font-weight:bold;";
            } else {

                if(tr.classList.contains("overtime")){
                    style+="background:#ff1a1a;color:#fff;";
                }
                else if(tr.classList.contains("warning")){
                    style+="background:#ffd966;color:#000;";
                }
                else{
                    style+="background:#93c47d;color:#000;";
                }

                if(td.classList.contains("predicted")){
                    style="border:1px solid #000;padding:6px;text-align:center;background:#ff4da6;color:#fff;";
                }
            }

            html+=`<td style="${style}">${text}</td>`;
        });

        html+="</tr>";
    });

    html+="</table></body></html>";

    let win = window.open("", "_blank");
    win.document.write(html);
    win.document.close();
}

</script>

</body>
</html>
